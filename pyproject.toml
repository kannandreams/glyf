[project]
name = "glyf"
version = "0.2.0"
description = "visualization build step to data pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Kannan Kalidasan" },
]
keywords = ["visualization", "dashboards", "charts", "analytics", "semantic-layer", "static-site", "dbt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "duckdb>=1.5.2",
    "altair>=6.1.0",
    "vl-convert-python>=1.9.0.post1",
    "pandas>=3.0.3",
    "jinja2>=3.1.6",
    "adbc-driver-manager>=1.11.0",
    "pyarrow>=25.0.0",
    "polars>=1.42.1",
]

[project.scripts]
glyf = "glyf.cli:app"

[project.urls]
Repository = "https://github.com/kannandreams/glyf"
Issues = "https://github.com/kannandreams/glyf/issues"
Documentation = "https://glyf.pages.dev"

[dependency-groups]
dev = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/glyf-core/Cargo.toml"
module-name = "glyf._core"
python-source = "src"
features = ["extension-module"]
include = [
    "src",
    "tests",
    "crates",
    ".cargo/config.toml",
    "Cargo.toml",
    "Cargo.lock",
    "docs",
    "docs-site",
    "examples",
    "README.md",
    "LICENSE",
    "CLA.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "GOVERNANCE.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/glyf"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
